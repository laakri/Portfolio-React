version: '3.8'

services:
  # Development service
  dev:
    build:
      context: .
      target: build
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    
  # Production service (behind Caddy reverse proxy)
  prod:
    build:
      context: .
    ports:
      - "8080:80"  # Changed: Caddy will handle 80/443, this runs on 8080
    environment:
      - NODE_ENV=production
    restart: unless-stopped